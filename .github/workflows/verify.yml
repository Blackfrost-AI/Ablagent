name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=ablagent --cov-report=term-missing
      - run: ruff check src tests scripts benchmarks
      - run: ruff format --check src tests scripts benchmarks
      - run: python benchmarks/validate.py --strict
      - run: |
          for corpus in R1-FALSE-REFUSAL-443-v1 R1-SMOKE-50-v1 CYBER-REASONING-10-v1; do
            python benchmarks/score.py --corpus "$corpus" --not-run > /dev/null
          done
      - run: python -m build
      - run: pip-audit
      - run: ablagent demo --run-dir .runs/ci
      - run: ablagent plan bound.direction.json --run-dir .runs/ci --alpha 1 --output one.plan.json
      - run: ablagent compile bound.direction.json --run-dir .runs/ci --plan one.plan.json --artifact-id ci
      - run: ablagent verify .runs/ci/ci.manifest.json
      - run: ablagent conformance --fixtures spec/dwmip/v0/conformance --run-dir .runs/conformance
      - run: python scripts/export_schemas.py --check
      - run: python scripts/verify_example_provenance.py

  real-offline:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      ABLAGENT_REQUIRE_REAL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Known supported CPU-only fixture environment; no checkpoint downloads.
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,real]' 'transformers==4.48.3'
      - run: python -c "from transformers import LlamaForCausalLM; import torch"
      - run: pytest tests/test_real_adapter.py -q

  excluded-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject local paths and common private-key material
        shell: bash
        run: |
          set -o pipefail
          # Exclude this workflow file: it necessarily contains the detection pattern itself.
          if git ls-files -z | grep -zv '^\.github/workflows/verify\.yml$' | xargs -0 grep -InE '\.agent_city|home-[0-9]{8}|/Users/craigmac|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|hf_[A-Za-z0-9]{20,}'; then
            echo 'Excluded local path or credential-like content found.' >&2
            exit 1
          fi
