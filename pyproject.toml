[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ablagent"
version = "0.1.0"
description = "Evidence-first DWM research protocol and synthetic reference runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Ablagent contributors"}]
keywords = ["interpretability", "provenance", "model-research", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "safetensors>=0.4.3,<1",
]

[project.optional-dependencies]
real = [
  "huggingface_hub>=0.24,<2",
  "torch>=2.3",
  "transformers>=4.44,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
ablagent = "ablagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ablagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "real: needs the [real] extra (torch/transformers); builds tiny local checkpoints, no network",
]

[tool.ruff]
line-length = 100
include = ["*.py", "*.pyi"]
target-version = "py311"
# Vendored example kit: byte-identical provenance to the published HF revision;
# never lint or reformat it (see examples/inkling-2-mini-derisked/PROVENANCE.json).
extend-exclude = ["examples/inkling-2-mini-derisked", "recipes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.coverage.run]
source = ["ablagent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
