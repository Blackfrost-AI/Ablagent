schema: blackfrost.benchmark-registry.v1
version: 2026-11-25
description: >-
  Prompt-only corpora for DWM false-refusal and qualitative security-reasoning
  research. The repository ships no model responses, scores, or judgments for
  these corpora; run artifacts must be generated by the operator and kept local.

boundary: >-
  An operator-controlled, release-only red-line corpus is intentionally absent
  from this repository. It was not opened or copied. The synthetic development
  fixture under packs/derisk/ is unrelated to that release corpus; see
  packs/derisk/NAMESPACE-NOTICE.md.

operator_standard:
  capture_thinking_mode: 'on'
  grading_region: extracted_answer_full_text
  denial: >-
    A score from these corpora is a measurement input, never a release
    authorization. Real-executor runs remain not_eligible until behavior,
    capability, and authorized release gates are recorded.

corpora:
  - id: R1-FALSE-REFUSAL-443-v1
    file: corpora/R1-FALSE-REFUSAL-443-v1.jsonl
    sha256: ba6431ca900cf41eb4f621cbf04d7f084187a16ec1ba6d1b8b6663967302d2e6
    rows: 443
    fields: [id, dataset, prompt, label]
    composition:
      advbench: {rows: 146, label: harmful, license: MIT}
      strongreject: {rows: 149, label: harmful, license: MIT}
      xstest: {rows: 148, labels: {safe: 75, unsafe: 73}, license: CC-BY-4.0}
    stage: S6_FALSE_REFUSAL_VERIFY
    split: evaluation_only
    usage_rule: >-
      Never tune prompts, directions, thresholds, or alpha on the 443. xstest
      safe rows are negative controls (false refusals); xstest unsafe rows are
      not automatically scored as failures (a refusal may be correct behavior).
    provenance: PROVENANCE.md#443-evaluation-corpus

  - id: R1-SMOKE-50-v1
    file: corpora/R1-SMOKE-50-v1.jsonl
    sha256: d932658a3946ab0ef4f357533b16c46b78ebc06eaccc40ae55aaf282d1023afa
    rows: 50
    fields: [dataset, prompt, label]
    composition: {advbench: {rows: 50, label: harmful}}
    stage: S5_SERVE_SMOKE_and_early_S6_checks
    split: development_wiring_only
    relation: >-
      The 50 prompt strings equal the first 50 prompt strings of the 443
      corpus, in order. It is a prompt sequence, not a byte-wise row slice
      (smoke rows carry no id field). Tuning on smoke rows contaminates the
      443 and must be recorded.
    provenance: PROVENANCE.md#smoke-50

  - id: CYBER-REASONING-10-v1
    file: corpora/CYBER-REASONING-10-v1.jsonl
    sha256: c8c27c8cee1b8e6de3c9e52cc180879eda8838bb8b7fccb3a22c332d0a69f374
    rows: 10
    fields: [id, topic, prompt]
    composition: {security_reasoning_probes: 10}
    stage: qualitative_probe
    split: qualitative_only
    usage_rule: >-
      No expected answers, rubric, or score key is shipped. Each row requires
      operator-authored qualitative review; report answered/refused/degenerate
      rather than a single "pass" rate.
    provenance: PROVENANCE.md#cyber-10

licenses:
  - {name: AdvBench (llm-attacks), license: MIT, file: LICENSES/AdvBench-MIT.txt}
  - {name: StrongREJECT, license: MIT, file: LICENSES/StrongREJECT-MIT.txt}
  - {name: XSTest, license: CC-BY-4.0, file: LICENSES/CC-BY-4.0-legalcode.txt}
  - {name: CYBER-REASONING-10-v1, license: Apache-2.0 (repository), file: ../LICENSE}

protocols:
  scoring: protocol/SCORING.md
  runs: protocol/RUNS.md
  schemas: [protocol/responses.schema.json, protocol/judgments.schema.json, protocol/metrics.schema.json]

tooling:
  validate: validate.py
  score: score.py
  collect: collect.py
  ci: ../.github/workflows/verify.yml

exclusions:
  - operator-controlled release-only red-line corpus (absent, never opened)
  - model responses / scores / judgments from historical runs
  - any private run path, endpoint, credential, or internal identifier
